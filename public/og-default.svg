<?xml version="1.0" encoding="UTF-8"?>
<!-- Editable source for og-default.jpg. Studio (production) palette:
     bg #f4f2ec · ink #14141a · accent #2b34ff. The shipped social image is
     the rasterised .jpg (fonts baked in); this vector mirrors its layout. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f2ec"/>
      <stop offset="1" stop-color="#efece3"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.875" cy="0.33" r="0.55">
      <stop offset="0" stop-color="#2b34ff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#2b34ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect x="0" y="0" width="8" height="630" fill="#2b34ff"/>

  <!-- Eyebrow (mono, tracked) -->
  <text x="88" y="128"
        font-family="'DM Mono', ui-monospace, monospace"
        font-size="22" font-weight="400" letter-spacing="4" fill="#6f6f6b">
    NIEZALEŻNY FRONTEND DEVELOPER
  </text>

  <!-- Wordmark (grotesque display) + accent fraction slash -->
  <text x="86" y="268"
        font-family="'Bricolage Grotesque', system-ui, sans-serif"
        font-size="118" font-weight="700" letter-spacing="-5" fill="#14141a">
    overflow<tspan fill="#2b34ff">⁄</tspan>
  </text>

  <line x1="88" y1="316.5" x2="560" y2="316.5" stroke="#14141a" stroke-opacity="0.14" stroke-width="1"/>

  <!-- Tagline (two lines; accent phrase in blue) -->
  <text x="88" y="408"
        font-family="'Bricolage Grotesque', system-ui, sans-serif"
        font-size="62" font-weight="700" letter-spacing="-2" fill="#14141a">
    Projektuję i tworzę strony,
  </text>
  <text x="88" y="480"
        font-family="'Bricolage Grotesque', system-ui, sans-serif"
        font-size="62" font-weight="700" letter-spacing="-2">
    <tspan fill="#2b34ff">które pracują</tspan><tspan fill="#14141a"> na markę.</tspan>
  </text>

  <!-- Footer (mono) -->
  <text x="88" y="582"
        font-family="'DM Mono', ui-monospace, monospace"
        font-size="18" font-weight="400" letter-spacing="2" fill="#6f6f6b">
    OVERFLOW-WEB.PL
  </text>
  <text x="1112" y="582" text-anchor="end"
        font-family="'DM Mono', ui-monospace, monospace"
        font-size="18" font-weight="400" letter-spacing="2" fill="#2b34ff">
    PL · RU · EN · UA
  </text>
</svg>
