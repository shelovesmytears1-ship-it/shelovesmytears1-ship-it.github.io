  <body>
    <div id="root"></div>
  <!-- universal-smooth-anchor-scroll -->
<script>
(function(){
  if(window.__ovSmoothScrollInit) return;
  window.__ovSmoothScrollInit = true;
  var animId = null;
  function cancel(){ if(animId){ cancelAnimationFrame(animId); animId = null; } }
  window.addEventListener('wheel', cancel, {passive:true});
  window.addEventListener('touchstart', cancel, {passive:true});
  window.addEventListener('keydown', cancel, {passive:true});
  function smoothTo(targetY, dur){
    cancel();
    var startY = window.scrollY || window.pageYOffset || 0;
    var maxScroll = Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
    var destY = Math.min(Math.max(0, targetY), maxScroll);
    var dist = destY - startY;
    if(Math.abs(dist) < 3) return;
    var startTime = performance.now();
    var d = dur || 780;
    function step(now){
      var t = Math.min((now - startTime) / d, 1);
      var ease = 1 - Math.pow(1 - t, 3);
      window.scrollTo(0, startY + dist * ease);
      if(t < 1) animId = requestAnimationFrame(step);
      else animId = null;
    }
    animId = requestAnimationFrame(step);
  }
  window.__ovSmoothScrollTo = smoothTo;
  document.addEventListener('click', function(e){
    var el = e.target.closest('a[href^="#"], [data-scroll-to], [data-target]');
    if(!el) return;
    var sel = el.getAttribute('data-scroll-to') || el.getAttribute('href');
    if(!sel || sel.charAt(0) !== '#') return;
    if(sel === '#'){
      if(el.classList.contains('logo-link') || el.classList.contains('brand')){
        e.preventDefault();
        smoothTo(0, 750);
      }
      return;
    }
    var target = null;
    try { target = document.querySelector(sel); } catch(err){}
    if(!target) return;
    e.preventDefault();
    e.stopImmediatePropagation();
    var header = document.querySelector('header, nav.navbar, .site-header, .top-nav, .nav-bar');
    var offset = 0;
    if(header){
      var pos = getComputedStyle(header).position;
      if(pos === 'fixed' || pos === 'sticky'){
        offset = header.offsetHeight || 72;
      }
    }
    var top = (window.scrollY || window.pageYOffset || 0) + target.getBoundingClientRect().top - offset;
    smoothTo(top, 780);
  }, true);
})();
</script>
