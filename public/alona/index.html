<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta http-equiv="refresh" content="0;url=https://alona-demo-overflow.vercel.app/?lang=pl" />
    <title>ALONA — nowa wersja demonstracyjna</title>
  </head>
  <body>
    <p>Przekierowanie do aktualnej wersji demonstracyjnej ALONA…</p>
    <p><a id="demo-link" href="https://alona-demo-overflow.vercel.app/?lang=pl">Otwórz demo ALONA</a></p>
    <script>
      const supported = new Set(['pl', 'en', 'ru']);
      const requested = new URLSearchParams(location.search).get('lang');
      const language = supported.has(requested) ? requested : 'pl';
      const destination = new URL('https://alona-demo-overflow.vercel.app/');
      destination.searchParams.set('lang', language);
      document.getElementById('demo-link').href = destination.href;
      if (navigator.serviceWorker) {
        navigator.serviceWorker.getRegistrations().then(registrations => {
          registrations.forEach(registration => registration.unregister());
        }).catch(() => {});
      }
      if (window.caches) {
        caches.keys().then(names => Promise.all(names
          .filter(name => name.startsWith('alona-kids-shell-'))
          .map(name => caches.delete(name)))).catch(() => {});
      }
      location.replace(destination.href);
    </script>
  </body>
</html>
