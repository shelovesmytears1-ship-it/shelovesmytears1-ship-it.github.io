# Netlify configuration for overflow portfolio v3
# Custom domain: overflow-web.pl (configured in Netlify UI)

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# i18n redirects — Netlify-level locale-aware 404 fallback
# (Astro static SSG doesn't auto-route per-locale 404s)
[[redirects]]
  from = "/en/*"
  to = "/en/404"
  status = 404

[[redirects]]
  from = "/ru/*"
  to = "/ru/404"
  status = 404

[[redirects]]
  from = "/ua/*"
  to = "/ua/404"
  status = 404

# Default (PL) 404 fallback
[[redirects]]
  from = "/*"
  to = "/404"
  status = 404

# Security + performance headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    # CSP: allow self + Google Fonts; 'unsafe-inline' kept for the inline
    # theme pre-paint script and inline style attributes (Astro). Restricts
    # all external script/frame/object sources.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'"

# Cache static assets aggressively
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
