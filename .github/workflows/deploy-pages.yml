name: Deploy all portfolio directions to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install current portfolio dependencies
        run: npm ci

      - name: Build Studio Light, Editorial Serif and Refined Dark
        run: npm run build

      - name: Restore the original portfolio snapshot
        run: git worktree add "$RUNNER_TEMP/portfolio-original" 4a6098e

      - name: Build the original portfolio under /original
        working-directory: ${{ runner.temp }}/portfolio-original
        run: |
          npm ci
          npx astro build --base /original

      - name: Add the original portfolio to the Pages artifact
        run: |
          mkdir -p dist/original
          cp -R "$RUNNER_TEMP/portfolio-original/dist/." dist/original/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
